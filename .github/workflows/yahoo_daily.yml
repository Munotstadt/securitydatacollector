name: Yahoo Collector (Daily)

on:
  schedule:
    # Alle 30 Minuten, Mo-So, 02:00-22:00 UTC
    - cron: '0,30 2-22 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install yfinance

      - name: Run collector
        run: python scripts/collect_yahoo_daily.py

      - name: Commit & push (mit Retry bei parallelen Collector-Läufen)
        run: |
          chmod +x scripts/commit_and_push_prices.sh
          scripts/commit_and_push_prices.sh "Yahoo Daily Collector: neue Kurse $(date -u +'%Y-%m-%d %H:%M UTC')"
