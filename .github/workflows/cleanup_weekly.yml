name: Weekly Cleanup (Prices > 380 Tage)

on:
  schedule:
    # Jeden Sonntag, 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: security-prices-write
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run cleanup
        run: python scripts/cleanup_old_prices.py

      - name: Commit & push if changed
        run: |
          git config user.name "securitydatacollector-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/security_prices.csv
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Weekly Cleanup: Preise >380 Tage entfernt $(date -u +'%Y-%m-%d')"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
