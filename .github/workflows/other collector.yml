name: Other Collector

on:
  schedule:
    # Analog Weekday-Cadence: alle 30 Minuten, Mo-Fr, 02:00-22:00 UTC
    - cron: '0,30 2-22 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run collector
        run: python scripts/collect_other.py

      - name: Commit & push (mit Retry bei parallelen Collector-Läufen)
        run: |
          chmod +x scripts/commit_and_push_prices.sh
          scripts/commit_and_push_prices.sh "Other Collector: neue Kurse $(date -u +'%Y-%m-%d %H:%M UTC')"
