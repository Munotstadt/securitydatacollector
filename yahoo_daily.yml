name: Yahoo Collector (Daily)

on:
  schedule:
    # Alle 30 Minuten, Mo-So, 02:00-22:00 UTC
    - cron: '0,30 2-22 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: security-prices-write
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install yfinance

      - name: Run collector
        run: python scripts/collect_yahoo_daily.py

      - name: Commit & push if changed
        run: |
          git config user.name "securitydatacollector-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/security_prices.csv
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Yahoo Daily Collector: neue Kurse $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
