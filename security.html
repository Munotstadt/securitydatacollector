<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security Detail</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#fff;--panel:#F7F8FA;--line:#E3E6EA;--text:#1A1D22;--muted:#767E8A;--accent:#E30613;--gain:#1F8A6E;--loss:#C0293D; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;padding:32px 16px 80px;display:flex;flex-direction:column;align-items:center;}
  .topnav{
    display:flex;gap:4px;flex-wrap:wrap;align-items:center;
    max-width:900px;width:100%;margin:0 auto 24px;padding:0 0 10px;
    border-bottom:1px solid var(--line);
    font-family:"IBM Plex Mono",monospace;font-size:12px;
  }
  .topnav a{ color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:3px;border:1px solid transparent;white-space:nowrap; }
  .topnav a:hover{color:var(--text);border-color:var(--line);}
  .board{width:100%;max-width:900px;}
  .toprow{display:flex;justify-content:flex-end;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px;}
  .detail-header{padding-bottom:18px;border-bottom:2px solid var(--accent);}
  .detail-header h2{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:24px;margin:0 0 12px;}
  .detail-stats{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;}
  .detail-price{font-family:'IBM Plex Mono',monospace;font-size:30px;font-weight:600;}
  .ccy{color:var(--muted);font-size:13px;}
  .detail-meta{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);}
  .returns{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;}
  .return-box{display:flex;flex-direction:column;gap:4px;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:3px;min-width:84px;}
  .return-label{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
  .return-value{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;}
  .return-date{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);}
  .return-value.up{color:var(--gain);} .return-value.down{color:var(--loss);} .return-value.flat{color:var(--muted);}

  .range52w-wrap{position:relative;margin:24px 0 4px;padding:30px 4px 0;}
  .range52w-current{position:absolute;top:0;transform:translateX(-50%);font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:15px;color:var(--text);white-space:nowrap;}
  .range52w-bar{position:relative;height:6px;border-radius:3px;background:linear-gradient(to right, #C7DEE0, #1F5F63);}
  .range52w-marker{position:absolute;top:-2px;transform:translate(-50%,-100%);font-size:11px;line-height:1;color:#1A3D40;}
  .range52w-labels{display:flex;justify-content:space-between;margin-top:12px;}
  .range52w-value{font-family:'IBM Plex Mono',monospace;font-size:15px;color:var(--text);display:block;}
  .range52w-date{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);display:block;margin-top:2px;}

  .section-title{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;margin:28px 0 4px;padding-bottom:8px;border-bottom:1px solid var(--line);}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px;}
  th{text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 6px;border-bottom:1px solid var(--line);}
  th.num{text-align:right;}
  td{padding:8px 6px;border-bottom:1px solid var(--line);}
  td.num, td.price, td.time{font-family:'IBM Plex Mono',monospace;text-align:right;white-space:nowrap;}
  td.chg{font-family:'IBM Plex Mono',monospace;text-align:right;font-size:13px;}
  .chg.up{color:var(--gain);} .chg.down{color:var(--loss);} .chg.flat{color:var(--muted);}

  .toggle-row{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 4px;}
  .toggle-btn{background:none;border:1px solid var(--line);color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:12px;padding:6px 12px;border-radius:3px;cursor:pointer;text-decoration:none;display:inline-block;}
  .toggle-btn:hover{border-color:var(--muted);color:var(--text);}
  .toggle-btn.active{background:var(--text);border-color:var(--text);color:#fff;font-weight:600;}
  .toggle-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
  .hidden{display:none !important;}

  .chart-wrap{margin:10px 0;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:16px 12px 8px;position:relative;}
  .chart-wrap svg{display:block;width:100%;height:auto;}
  .chart-empty{padding:30px 10px;text-align:center;color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:13px;}
  .chart-legend{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);margin-top:6px;}
  .chart-tooltip{
    position:absolute;pointer-events:none;background:var(--text);color:#fff;
    font-family:'IBM Plex Mono',monospace;font-size:11px;padding:5px 8px;border-radius:3px;
    white-space:nowrap;transform:translate(-50%,-115%);display:none;z-index:5;
  }
  .chart-point{cursor:pointer;}

  .history-links{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;}

  .quick-form{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px;margin-top:8px;}
  .quick-form .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;}
  .quick-form .field label{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px;}
  .quick-form input, .quick-form select{
    width:100%;font-family:'Inter',sans-serif;font-size:14px;color:var(--text);background:var(--bg);
    border:1px solid var(--line);border-radius:3px;padding:8px 9px;outline:none;
  }
  .quick-form input:focus, .quick-form select:focus{border-color:var(--accent);}
  .quick-form .actions{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-top:12px;}
  .quick-form button{
    font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
    background:var(--accent);color:#fff;border:none;border-radius:3px;padding:10px 18px;cursor:pointer;
  }
  .quick-form button:hover{background:#b8050f;}
  .quick-status{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);}
  .quick-status.ok{color:var(--gain);}
  .quick-status.err{color:var(--loss);}

  .settings{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px;margin-bottom:8px;display:none;gap:8px;}
  .settings.show{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;}
  .settings label{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);display:block;margin-bottom:3px;}
  .settings input{width:100%;font-family:'Inter',sans-serif;font-size:14px;padding:8px 9px;border:1px solid var(--line);border-radius:3px;background:var(--bg);color:var(--text);}

  .master-form{margin-top:8px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;}
  .master-form .field label{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px;}
  .master-form input, .master-form select{
    width:100%;font-family:'Inter',sans-serif;font-size:14px;color:var(--text);background:var(--panel);
    border:1px solid var(--line);border-radius:3px;padding:9px 10px;outline:none;
  }
  .master-form input:disabled{color:var(--muted);background:#EFF1F4;}
  .master-form input:focus, .master-form select:focus{border-color:var(--accent);}
  .otherWrap{margin-top:6px;display:none;}
  .otherWrap.show{display:block;}

  .empty,.error{padding:30px 10px;text-align:center;color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:13px;}
  .error{color:var(--loss);}
  .table-wrap{max-height:50vh;overflow-y:auto;}
</style>

<script src="assets/github-data.js"></script>
<script>
function fmtPct(v){
  if(v===null||v===undefined||isNaN(v)) return {text:'—',dir:'flat'};
  const r = Math.round(v*100)/100;
  const dir = r>0?'up':(r<0?'down':'flat');
  return {text:`${r>0?'+':''}${r.toFixed(2)}%`, dir};
}
function pctChange(now, ref){ return (!ref || !ref.Price) ? null : ((now - ref.Price) / ref.Price) * 100; }

function collapseToDaily(obsSortedAsc){
  const byDay = new Map();
  for(const o of obsSortedAsc){
    const key = o.dt.toISOString().slice(0,10);
    byDay.set(key, o);
  }
  return [...byDay.values()].sort((a,b)=>a.dt-b.dt);
}

function startOfYear(d){ return new Date(d.getFullYear(), 0, 1); }
/* Dezimalstellen-Regel für Y-Achsen-Beschriftung in Charts:
 * > 9'999  -> 0 Dezimalstellen
 * < 9.99   -> 4 Dezimalstellen
 * sonst    -> 2 Dezimalstellen */
function decideAxisDecimals(v){
  const abs = Math.abs(v);
  if(abs > 9999) return 0;
  if(abs < 9.99) return 4;
  return 2;
}

function filterByRange(daily, range){
  if(range === 'ALL') return daily;
  const now = new Date();
  let cutoff;
  if(range === '10D') cutoff = daysAgo(now, 10);
  else if(range === '30D') cutoff = daysAgo(now, 30);
  else if(range === 'YTD') cutoff = startOfYear(now);
  else if(range === '12M') cutoff = daysAgo(now, 365);
  else return daily;
  return daily.filter(p => p.dt >= cutoff);
}
function filterDistByRange(dist, range){
  if(range === 'ALL') return dist;
  const days = range === '12M' ? 365 : 730; // 24M (default) sonst
  const cutoff = daysAgo(new Date(), days);
  return dist.filter(d => d.exDate >= cutoff);
}

function showTooltip(evt, wrap, tooltip, html){
  const rect = wrap.getBoundingClientRect();
  const x = (evt.touches ? evt.touches[0].clientX : evt.clientX) - rect.left;
  const y = (evt.touches ? evt.touches[0].clientY : evt.clientY) - rect.top;
  tooltip.style.left = x + 'px';
  tooltip.style.top = y + 'px';
  tooltip.innerHTML = html;
  tooltip.style.display = 'block';
}

function drawLineChart(container, tooltip, points, decimals, currency){
  const width=800, height=240;
  if(points.length < 2){ container.innerHTML = '<div class="chart-empty">Not enough data points for a chart.</div>'; return; }
  const amounts = points.map(p=>p.Price);
  const minY = Math.min(...amounts), maxY = Math.max(...amounts);
  const yPad = (maxY-minY)*0.08 || maxY*0.01 || 1;
  const yMin = minY-yPad, yMax = maxY+yPad;
  const axisDecimals = decideAxisDecimals(maxY);

  // Dynamischer linker Rand: reicht der feste Platz nicht für die breiteste
  // Achsenbeschriftung (z.B. 5-6-stellige Preise wie bei BTC), wird der
  // Text sonst links über den Rand hinaus geschrieben und vom SVG-viewBox
  // abgeschnitten - sieht dann aus wie eine fehlende führende Ziffer.
  const widestLabel = fmtDecimal(Math.max(Math.abs(yMin), Math.abs(yMax)), axisDecimals);
  const leftPad = Math.max(56, widestLabel.length * 7 + 16);
  const pad = {top:14, right:14, bottom:26, left:leftPad};
  const innerW = width-pad.left-pad.right, innerH = height-pad.top-pad.bottom;

  const minX = points[0].dt.getTime(), maxX = points[points.length-1].dt.getTime();
  const xSpan = (maxX-minX) || 1;
  const xScale = t => pad.left + ((t-minX)/xSpan)*innerW;
  const yScale = v => pad.top + innerH - ((v-yMin)/(yMax-yMin))*innerH;
  const lineColor = amounts[amounts.length-1] >= amounts[0] ? '#1F8A6E' : '#C0293D';
  let d = '';
  points.forEach((p,i) => { const x=xScale(p.dt.getTime()), y=yScale(p.Price); d += (i===0?'M':'L')+x.toFixed(1)+','+y.toFixed(1)+' '; });
  const areaD = d + `L${xScale(maxX).toFixed(1)},${(pad.top+innerH).toFixed(1)} L${xScale(minX).toFixed(1)},${(pad.top+innerH).toFixed(1)} Z`;
  let grid = '';
  for(let i=0;i<=4;i++){
    const v = yMin + (i/4)*(yMax-yMin), y = yScale(v);
    grid += `<line x1="${pad.left}" y1="${y.toFixed(1)}" x2="${width-pad.right}" y2="${y.toFixed(1)}" stroke="#E3E6EA" stroke-width="1"/>`;
    grid += `<text x="${pad.left-8}" y="${(y+3).toFixed(1)}" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="10" fill="#767E8A">${fmtDecimal(v,axisDecimals)}</text>`;
  }
  const mid = points[Math.floor(points.length/2)];
  const xLabels = [
    { p: points[0], anchor: 'start' },
    { p: mid, anchor: 'middle' },
    { p: points[points.length-1], anchor: 'end' },
  ].map(({p, anchor}) => {
    const x = xScale(p.dt.getTime());
    return `<text x="${x.toFixed(1)}" y="${height-8}" text-anchor="${anchor}" font-family="IBM Plex Mono, monospace" font-size="10" fill="#767E8A">${fmtDateOnly(p.dt)}</text>`;
  }).join('');

  // Punkt 7: antippbare/hoverbare Datenpunkte mit Tooltip (Datum + Preis) -
  // hilft insbesondere, einzelne Ausreisser-Datenpunkte in der Historie zu
  // identifizieren, wenn der Chart-Massstab unerwartet wirkt.
  let dots = '';
  points.forEach(p => {
    const x = xScale(p.dt.getTime()), y = yScale(p.Price);
    dots += `<circle class="chart-point" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="7" fill="transparent" data-date="${fmtDateOnly(p.dt)}" data-price="${fmtDecimal(p.Price,decimals)}"/>`;
  });

  container.innerHTML = `<svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Price chart">
    ${grid}
    <path d="${areaD}" fill="${lineColor}" opacity="0.08" stroke="none"/>
    <path d="${d.trim()}" fill="none" stroke="${lineColor}" stroke-width="2"/>
    ${dots}
    ${xLabels}
  </svg>`;
  container.appendChild(tooltip);

  const svgEl = container.querySelector('svg');
  svgEl.querySelectorAll('.chart-point').forEach(dot => {
    const show = (evt) => { evt.preventDefault(); showTooltip(evt, container, tooltip, `${dot.dataset.date}: ${dot.dataset.price} ${currency||''}`); };
    dot.addEventListener('mouseenter', show);
    dot.addEventListener('mousemove', show);
    dot.addEventListener('touchstart', show, {passive:false});
    dot.addEventListener('mouseleave', () => tooltip.style.display='none');
  });
  svgEl.addEventListener('touchend', () => setTimeout(()=>{ tooltip.style.display='none'; }, 1500));
}

function computeRolling12m(sorted){
  return sorted.map(d => {
    const start = daysAgo(d.exDate, 365);
    const sum = sorted.filter(x => x.exDate > start && x.exDate <= d.exDate).reduce((s,x)=>s+x.amount,0);
    return { exDate: d.exDate, rollingSum: sum };
  });
}

function drawDistributionChart(container, tooltip, displayDist, allDist, currency){
  if(!displayDist.length){ container.innerHTML = '<div class="chart-empty">No dividends for this period.</div>'; return; }
  const width=800, height=240;
  const sorted = [...displayDist].sort((a,b)=>a.exDate-b.exDate);
  const maxBar = Math.max(...sorted.map(d=>d.amount))*1.15 || 1;
  const rolling = computeRolling12m(sorted, allDist);
  const maxRoll = Math.max(...rolling.map(r=>r.rollingSum), 0)*1.15 || 1;

  // Dynamischer linker/rechter Rand, analog drawLineChart: verhindert
  // Abschneiden bei breiten Beträgen (linke Achse: Balkenbeträge, rechte
  // Achse: rollierende 12-Monats-Summe, potenziell deutlich grösser).
  const leftAxisDecimals = decideAxisDecimals(maxBar);
  const rightAxisDecimals = decideAxisDecimals(maxRoll);
  const leftPad = Math.max(56, fmtDecimal(maxBar,leftAxisDecimals).length * 7 + 16);
  const rightPad = Math.max(56, fmtDecimal(maxRoll,rightAxisDecimals).length * 7 + 16);
  const pad = {top:14, right:rightPad, bottom:26, left:leftPad};
  const innerW = width-pad.left-pad.right, innerH = height-pad.top-pad.bottom;

  const minX = sorted[0].exDate.getTime(), maxX = sorted[sorted.length-1].exDate.getTime();
  const xSpan = (maxX-minX) || 1;

  // Punkt 10: schmalere Balken + seitliches Innenpolster, damit die äusseren
  // Balken nicht mit der Y-Achse/dem Plotrand verschmelzen.
  const barW = Math.max(3, Math.min(14, innerW/Math.max(sorted.length,1) - 10));
  const xPad = Math.max(barW * 1.5, 16);
  const xScale = t => pad.left + xPad/2 + ((t-minX)/xSpan)*(innerW-xPad);

  const yScaleBar = v => pad.top + innerH - (v/maxBar)*innerH;
  const yScaleRoll = v => pad.top + innerH - (v/maxRoll)*innerH;

  let bars = '';
  sorted.forEach(d => {
    const x = xScale(d.exDate.getTime()) - barW/2, y = yScaleBar(d.amount), h = (pad.top+innerH)-y;
    bars += `<rect class="chart-point" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" fill="#1F8A6E" opacity="0.55" data-date="${fmtDateOnly(d.exDate)}" data-amount="${fmtDecimal(d.amount,2)}"/>`;
  });

  let rollLine = '';
  if(rolling.length >= 2){
    let d = '';
    rolling.forEach((r,i)=>{ const x=xScale(r.exDate.getTime()), y=yScaleRoll(r.rollingSum); d += (i===0?'M':'L')+x.toFixed(1)+','+y.toFixed(1)+' '; });
    rollLine = `<path d="${d.trim()}" fill="none" stroke="#C0293D" stroke-width="2" stroke-dasharray="4 3"/>`;
  }

  let grid = '', rightLabels = '';
  for(let i=0;i<=4;i++){
    const v = (i/4)*maxBar, y = yScaleBar(v);
    grid += `<line x1="${pad.left}" y1="${y.toFixed(1)}" x2="${width-pad.right}" y2="${y.toFixed(1)}" stroke="#E3E6EA" stroke-width="1"/>`;
    grid += `<text x="${pad.left-8}" y="${(y+3).toFixed(1)}" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="10" fill="#767E8A">${fmtDecimal(v,leftAxisDecimals)}</text>`;
    const vr = (i/4)*maxRoll, yr = yScaleRoll(vr);
    rightLabels += `<text x="${width-pad.right+8}" y="${(yr+3).toFixed(1)}" text-anchor="start" font-family="IBM Plex Mono, monospace" font-size="10" fill="#C0293D">${fmtDecimal(vr,rightAxisDecimals)}</text>`;
  }
  const mid = sorted[Math.floor(sorted.length/2)];
  const xLabels = [
    { d: sorted[0], anchor: 'start' },
    { d: mid, anchor: 'middle' },
    { d: sorted[sorted.length-1], anchor: 'end' },
  ].map(({d, anchor}) => {
    const x = xScale(d.exDate.getTime());
    return `<text x="${x.toFixed(1)}" y="${height-8}" text-anchor="${anchor}" font-family="IBM Plex Mono, monospace" font-size="10" fill="#767E8A">${fmtDateOnly(d.exDate)}</text>`;
  }).join('');

  container.innerHTML = `<svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Distribution chart">
    ${grid}${bars}${rollLine}${rightLabels}${xLabels}
  </svg>
  <div class="chart-legend">Bars: dividend per ex-date (left axis) · Dashed: rolling 12-month sum (right axis)</div>`;
  container.appendChild(tooltip);

  const svgEl = container.querySelector('svg');
  svgEl.querySelectorAll('.chart-point').forEach(bar => {
    const show = (evt) => { evt.preventDefault(); showTooltip(evt, container, tooltip, `${bar.dataset.date}: ${bar.dataset.amount} ${currency||''}`); };
    bar.addEventListener('mouseenter', show);
    bar.addEventListener('mousemove', show);
    bar.addEventListener('touchstart', show, {passive:false});
    bar.addEventListener('mouseleave', () => tooltip.style.display='none');
  });
}

async function load(){
  const params = new URLSearchParams(location.search);
  secId = params.get('id');
  if(!secId){
    document.getElementById('detailName').textContent = 'No security specified (?id=... missing)';
    return;
  }

  document.getElementById('linkPriceHistory').href = `price_editor.html?id=${encodeURIComponent(secId)}`;
  document.getElementById('linkDividendHistory').href = `distribution_editor.html?id=${encodeURIComponent(secId)}`;
  document.getElementById('qdExDate').value = nowZurichDateString().split('.').reverse().join('-');

  try{
    const [masterText, pricesText, distText] = await Promise.all([
      ghFetchRaw('data/security_master.csv'),
      ghFetchRaw('data/security_prices.csv'),
      ghFetchRaw('data/security_distributions.csv'),
    ]);
    const masterParsed = parseCSV(masterText);
    allMasterRows = masterParsed.rows;
    masterHeader = masterParsed.header;
    const allPrices = parseCSV(pricesText).rows.map(r => ({
      SecurityID: r.SecurityID, Price: parseFloat(r.Price), dt: parseSwissDateTime(r.PriceDate), Source: r.Source || '',
    })).filter(r => r.dt && !isNaN(r.Price));

    const bySecurity = {};
    for(const p of allPrices) (bySecurity[p.SecurityID] = bySecurity[p.SecurityID] || []).push(p);
    for(const id in bySecurity) bySecurity[id].sort((a,b)=>a.dt-b.dt);

    const fxMap = buildFxMap(allMasterRows, bySecurity);

    masterRow = allMasterRows.find(m => m.SecurityID === secId);
    const name = masterRow ? masterRow.SecurityName : secId;
    const currency = masterRow ? masterRow.Currency : '';
    const decimals = masterRow && masterRow.Instrument === 'Currency' ? 4 : 2;

    document.getElementById('detailName').textContent = name;
    document.title = `${name} · Security Detail`;
    document.getElementById('detailCcy').textContent = currency;
    document.getElementById('qdCurrency').value = currency;

    if(masterRow) renderMasterForm();
    else document.getElementById('masterForm').innerHTML = '<div class="empty">No master data found for this Security ID.</div>';

    const rows = bySecurity[secId] || [];
    const distRows = parseCSV(distText).rows
      .filter(r => r.SecurityID === secId)
      .map(r => ({
        exDate: parseSwissDate(r.ExDate), payDate: parseSwissDate(r.PayDate),
        amount: parseFloat(r.DistributionAmount), currency: r.Currency || currency, source: r.Source || '',
      }))
      .filter(d => d.exDate && !isNaN(d.amount))
      .sort((a,b)=>a.exDate-b.exDate);

    document.getElementById('pointCountNote').textContent = `${rows.length} price point(s) · ${distRows.length} dividend point(s)`;

    if(rows.length === 0){
      document.getElementById('detailPrice').textContent = '—';
      document.getElementById('chartWrap').innerHTML = '<div class="chart-empty">No price data for this security.</div>';
      document.getElementById('perfBody').innerHTML = '<tr><td colspan="6" class="empty">No data.</td></tr>';
      return;
    }

    const daily = collapseToDaily(rows);
    const last = daily[daily.length-1];
    const prev = daily.length >= 2 ? daily[daily.length-2] : null;
    const now = new Date();

    // Cutoffs bewusst auf 23:59:59 des Zieltags gesetzt ("letzter Kurs von
    // diesem Tag"), statt die aktuelle Uhrzeit von "now" zu übernehmen. Sonst
    // kann es passieren, dass ein an diesem Tag später erfasster FX-Kurs
    // (z.B. USD/CHF) fälschlich als "nicht vorhanden" gilt, nur weil er
    // zeitlich nach dem Referenz-Zeitstempel der Wertschrift liegt.
    function endOfDay(d){ const r = new Date(d); r.setHours(23,59,59,999); return r; }
    const cutoffWeek = endOfDay(daysAgo(now,7));
    const cutoffMonth = endOfDay(daysAgo(now,30));
    const cutoffYtd = endOfDay(daysAgo(startOfYear(now), 1)); // 31.12. Vorjahr, 23:59:59
    const cutoff1y = endOfDay(daysAgo(now,365));

    const refWeek = findOnOrBefore(daily, cutoffWeek);
    const refMonth = findOnOrBefore(daily, cutoffMonth);
    const refYtd = findOnOrBefore(daily, cutoffYtd);
    const ref1y = findOnOrBefore(daily, cutoff1y);

    const last52w = rows.filter(r => r.dt >= daysAgo(now,365));
    const high52wRow = last52w.length ? last52w.reduce((a,b)=> b.Price>a.Price ? b : a) : null;
    const low52wRow = last52w.length ? last52w.reduce((a,b)=> b.Price<a.Price ? b : a) : null;
    const fmtDateYY = d => { const dd=String(d.getDate()).padStart(2,'0'); const mm=String(d.getMonth()+1).padStart(2,'0'); const yy=String(d.getFullYear()).slice(-2); return `${dd}.${mm}.${yy}`; };

    document.getElementById('detailPrice').textContent = fmtDecimal(last.Price, decimals);
    document.getElementById('detailMeta').textContent = `As of ${fmtShortDateTime(last.dt)} · Source: ${last.Source || '—'}`;

    // Punkt 9: Dividend Yield ebenfalls als Kachel (zusätzlich zur Textzeile unten)
    const oneYearAgo = daysAgo(now, 365);
    const dist12m = distRows.filter(d => d.exDate > oneYearAgo && d.exDate <= now).reduce((s,d)=>s+d.amount,0);
    const yieldPct = last.Price ? (dist12m/last.Price)*100 : null;

    const returns = [
      { label:'Day', ref: prev }, { label:'Week', ref: refWeek },
      { label:'Month', ref: refMonth }, { label:'YTD', ref: refYtd }, { label:'1 Year', ref: ref1y },
    ];
    let returnsHtml = returns.map(r => {
      const chg = pctChange(last.Price, r.ref);
      const f = fmtPct(chg);
      return `<div class="return-box"><span class="return-label">${r.label}</span><span class="return-value ${f.dir}">${f.text}</span></div>`;
    }).join('');
    returnsHtml += `<div class="return-box"><span class="return-label">Dividend Yield</span><span class="return-value ${yieldPct!==null&&yieldPct>0?'up':'flat'}">${yieldPct!==null?yieldPct.toFixed(2)+'%':'—'}</span></div>`;
    document.getElementById('returnsBoxes').innerHTML = returnsHtml;

    renderRange52w(high52wRow, low52wRow, last, decimals);

    document.getElementById('thPriceLc').textContent = `Price Return ${currency}`;
    document.getElementById('thTotalLc').textContent = `Total Return ${currency}`;

    function sumDist(fromDt, toDt){
      return distRows.filter(d => d.exDate > fromDt && d.exDate <= toDt).reduce((s,d)=>s+d.amount,0);
    }
    function sumDistChf(fromDt, toDt){
      return distRows.filter(d => d.exDate > fromDt && d.exDate <= toDt).reduce((s,d)=>{
        const fx = fxRateOnDateWithFallback(fxMap, d.currency, d.exDate);
        return s + (fx.rate!==null ? d.amount*fx.rate : 0);
      },0);
    }
    let anyApprox = false;
    function computePeriod(ref, cutoff){
      if(!ref) return { priceLc:null, totalLc:null, cry:null, priceChf:null, totalChf:null, approx:false };
      const priceLc = pctChange(last.Price, ref);
      const distSum = sumDist(ref.dt, last.dt);
      const totalLc = ref.Price ? ((last.Price - ref.Price + distSum) / ref.Price) * 100 : null;

      // WICHTIG: Der FX-Kurs wird gegen denselben ursprünglichen Perioden-
      // Cutoff gesucht wie der Wertschriften-Kurs (nicht gegen ref.dt, den
      // bereits aufgelösten Zeitstempel DIESER Wertschrift!). Sonst kann ein
      // FX-Kurs vom SELBEN Tag, der zeitlich nach ref.dt liegt, fälschlich
      // als "nicht vorhanden" gelten, obwohl er existiert.
      const nowFx = fxRateOnDateWithFallback(fxMap, currency, endOfDay(now));
      const refFx = fxRateOnDateWithFallback(fxMap, currency, cutoff);
      let cry = null, priceChf = null, totalChf = null;
      const approx = nowFx.approx || refFx.approx;
      if(nowFx.rate !== null && refFx.rate !== null){
        cry = refFx.rate ? ((nowFx.rate-refFx.rate)/refFx.rate)*100 : null;
        const nowChf = last.Price*nowFx.rate, refChf = ref.Price*refFx.rate;
        priceChf = refChf ? ((nowChf-refChf)/refChf)*100 : null;
        const distSumChf = sumDistChf(ref.dt, last.dt);
        totalChf = refChf ? ((nowChf-refChf+distSumChf)/refChf)*100 : null;
        if(approx) anyApprox = true;
      }
      return { priceLc, totalLc, cry, priceChf, totalChf, approx };
    }

    const cutoffDay = endOfDay(daysAgo(now,1));
    const periods = [
      { label:'Day', ref:prev, cutoff:cutoffDay }, { label:'Week', ref:refWeek, cutoff:cutoffWeek },
      { label:'Month', ref:refMonth, cutoff:cutoffMonth },
      { label:'YTD', ref:refYtd, cutoff:cutoffYtd }, { label:'1 Year', ref:ref1y, cutoff:cutoff1y },
    ];
    document.getElementById('perfBody').innerHTML = periods.map(p => {
      const r = computePeriod(p.ref, p.cutoff);
      const a=fmtPct(r.priceLc), b=fmtPct(r.totalLc), cr=fmtPct(r.cry), c=fmtPct(r.priceChf), e=fmtPct(r.totalChf);
      const mark = r.approx ? '<span title="FX-Kurs genähert: keine Notierung so weit zurück vorhanden, älteste verfügbare Notierung verwendet.">*</span>' : '';
      return `<tr>
        <td>${p.label}</td>
        <td class="chg ${a.dir}">${a.text}</td>
        <td class="chg ${b.dir}">${b.text}</td>
        <td class="chg ${cr.dir}">${cr.text}${mark}</td>
        <td class="chg ${c.dir}">${c.text}${mark}</td>
        <td class="chg ${e.dir}">${e.text}${mark}</td>
      </tr>`;
    }).join('');
    if(anyApprox){
      document.getElementById('yieldNote').insertAdjacentHTML('beforebegin',
        '<div class="detail-meta">* FX rate approximated (no quote that far back yet - oldest available FX quote used instead).</div>');
    }

    document.getElementById('yieldNote').textContent = yieldPct !== null
      ? `Dividend yield (last 12 months vs. price ${currency}): ${yieldPct.toFixed(2)}%`
      : 'No dividend data available.';

    let currentView = 'price', currentPriceRange = '12M', currentDistRange = '24M';
    const chartWrap = document.getElementById('chartWrap');
    const chartTooltip = document.getElementById('chartTooltip');
    const chartTitle = document.getElementById('chartTitle');
    const priceRangeRow = document.getElementById('priceRangeRow');
    const distRangeRow = document.getElementById('distRangeRow');

    function renderChart(){
      if(currentView === 'dividends'){
        chartTitle.textContent = 'Dividend Chart';
        priceRangeRow.classList.add('hidden'); distRangeRow.classList.remove('hidden');
        drawDistributionChart(chartWrap, chartTooltip, filterDistByRange(distRows, currentDistRange), distRows, currency);
      } else {
        chartTitle.textContent = 'Price Chart';
        priceRangeRow.classList.remove('hidden'); distRangeRow.classList.add('hidden');
        drawLineChart(chartWrap, chartTooltip, filterByRange(daily, currentPriceRange), decimals, currency);
      }
    }

    document.querySelectorAll('#viewToggle .toggle-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        currentView = btn.dataset.view;
        document.querySelectorAll('#viewToggle .toggle-btn').forEach(b=>b.classList.toggle('active', b===btn));
        renderChart();
      });
    });
    document.querySelectorAll('#priceRangeRow .toggle-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        currentPriceRange = btn.dataset.range;
        document.querySelectorAll('#priceRangeRow .toggle-btn').forEach(b=>b.classList.toggle('active', b===btn));
        renderChart();
      });
    });
    document.querySelectorAll('#distRangeRow .toggle-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        currentDistRange = btn.dataset.range;
        document.querySelectorAll('#distRangeRow .toggle-btn').forEach(b=>b.classList.toggle('active', b===btn));
        renderChart();
      });
    });

    renderChart();

  }catch(e){
    document.getElementById('detailName').textContent = 'Error';
    document.getElementById('chartWrap').innerHTML = `<div class="error">Error: ${e.message}</div>`;
  }
}

load();
</script>
</body>
</html>
